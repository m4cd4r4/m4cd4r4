name: Generate Snake

on:
  schedule:
    # Weekly (Sunday 00:00 UTC). Was every 12h, ~40 Actions jobs a month to
    # redraw a decorative animation on a profile README. (2026-08-23.)
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: m4cd4r4
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
